<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>התחברות | Gemini Scanner</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{width:min(380px,100%);background:linear-gradient(160deg,#161f37,#0e1526);border:1px solid #3d4d6f;border-radius:18px;padding:32px 28px;text-align:center;box-shadow:0 24px 60px #00000066}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
.login-brand .brand-mark{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;font-weight:800;font-size:22px;background:linear-gradient(145deg,var(--purple),var(--blue));box-shadow:0 10px 28px #6258ff4d}
.login-brand b{font-size:15px;letter-spacing:1px}
.login-brand span{font-size:11px;letter-spacing:1.8px;color:var(--muted)}
.login-step p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login-btn{width:100%;border:0;border-radius:10px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--purple),#5b71e8);font:700 14px Heebo;cursor:pointer}
.login-btn:disabled{opacity:.5;cursor:default}
.login-input{width:100%;border:1px solid #344360;border-radius:10px;padding:13px 12px;color:#eef3ff;background:#0a1222;font:700 22px Consolas,monospace;letter-spacing:8px;text-align:center;outline:0;margin-bottom:14px;direction:ltr}
.login-input:focus{border-color:#8266ff}
.login-msg{min-height:18px;margin-top:14px;font-size:12px}
.login-msg.error{color:#ff9aaa}
.login-msg.ok{color:#5ee0a0}
.login-resend{margin-top:14px;background:0;border:0;color:#9eaff0;font:600 12px Heebo;cursor:pointer}
#step-code{display:none}
</style></head>
<body>
<div class="login-card">
  <div class="login-brand"><div class="brand-mark">G</div><b>GEMINI SCANNER</b><span>JIO ACTIVATION</span></div>
  <div class="login-step" id="step-send">
    <p>לחץ לשליחת קוד התחברות חד-פעמי.</p>
    <button class="login-btn" id="sendBtn" type="button">שליחת קוד</button>
  </div>
  <div class="login-step" id="step-code">
    <p>הזן את הקוד בן 6 הספרות שנשלח אליך.</p>
    <input class="login-input" id="codeInput" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="one-time-code">
    <button class="login-btn" id="verifyBtn" type="button">אישור קוד</button>
    <button class="login-resend" id="resendBtn" type="button">שלח קוד חדש</button>
  </div>
  <div class="login-msg" id="msg"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const msg=(text,type)=>{const el=$('msg');el.textContent=text||'';el.className='login-msg'+(type?' '+type:'')};
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  return {ok:r.ok,data:await r.json().catch(()=>({}))};
}
async function sendCode(){
  const btn=$('sendBtn');btn.disabled=true;btn.textContent='שולח...';
  const r=await post('/login/send');
  btn.disabled=false;btn.textContent='שליחת קוד';
  if(r.data.ok){
    $('step-send').style.display='none';$('step-code').style.display='block';
    msg('קוד נשלח למייל.','ok');$('codeInput').focus();
  }else msg(r.data.error||'שליחת הקוד נכשלה.','error');
}
async function verifyCode(){
  const code=$('codeInput').value.trim();
  if(code.length!==6){msg('יש להזין קוד בן 6 ספרות.','error');return}
  const btn=$('verifyBtn');btn.disabled=true;btn.textContent='בודק...';
  const r=await post('/login/verify',{code});
  btn.disabled=false;btn.textContent='אישור קוד';
  if(r.data.ok){msg('התחברת בהצלחה, מעביר...','ok');location.href='/'}
  else msg(r.data.error||'קוד שגוי.','error');
}
$('sendBtn').onclick=sendCode;
$('resendBtn').onclick=sendCode;
$('verifyBtn').onclick=verifyCode;
$('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')verifyCode()});
$('codeInput').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});
</script>
</body></html>
